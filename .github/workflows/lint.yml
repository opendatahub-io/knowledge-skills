name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - name: Run skillsaw
      uses: stbenjam/skillsaw@ac135381fc46711e7615e30b7296e857bb20b645 # v0
      with:
        strict: 'true'

